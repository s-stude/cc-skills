			const li = el("li", {}, $("sourceList"));
			if (source.href) el("a", { href: source.href }, li, source.label);
			else el("span", {}, li, source.label);
			if (source.note) li.append(` — ${source.note}`);
		}
	}
	document.addEventListener("keydown", event => { if (event.key === "Escape" && !$("detail").hidden) closeDetail(); });
	window.addEventListener("beforeprint", () => document.querySelectorAll("details").forEach(item => { item.open = true; }));
}
boot();
</script>
</body>
</html>
